[project]
name = "orqen-workers"
version = "0.0.0"
description = "Orqen stream workers: orchestrator, executor, grader, watchdog."
requires-python = ">=3.12,<3.13"
dependencies = [
    "orqen-core",
]

[project.scripts]
orqen-workers = "orqen_workers.cli:main"

[tool.uv.sources]
orqen-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orqen_workers"]
