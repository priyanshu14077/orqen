[project]
name = "orqen-core"
version = "0.0.0"
description = "Shared models, settings, Redis keyspace and database access for Orqen services."
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orqen_core"]
