[project]
name = "orqen-harness"
version = "0.0.0"
description = "Orqen agent loop and model adapters. Runs inside the sandbox; must stay free of server-side dependencies."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orqen_harness"]
