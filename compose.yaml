name: orqen

services:
  redis:
    image: redis:7-alpine

    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec" ]
    ports:
      - "${ORQEN_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [ backend ]

  postgres-test:
    profiles: [ test ]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orqen
      POSTGRES_PASSWORD: orqen
      POSTGRES_DB: orqen_test
    ports:
      - "${ORQEN_TEST_PG_PORT:-5433}:5432"

    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orqen -d orqen_test" ]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  backend:
    name: orqen-backend

  sandbox:
    name: orqen-sandbox
    internal: true

volumes:
  redisdata:
